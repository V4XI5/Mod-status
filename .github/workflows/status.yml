name: Mod status

on:
  schedule:
    - cron: "0 */3 * * *"  # every 3 hours
  workflow_dispatch:
    inputs:
      mode:
        description: "What to do"
        type: choice
        default: working
        options:
          - working
          - broken
          - check

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Update badge
        run: python scripts/update.py "${{ inputs.mode || 'check' }}"
      - name: Commit if changed
        run: |
          git config user.name "status-bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add state.json status.json
          git diff --cached --quiet || (git commit -m "Update mod status" && git push)
