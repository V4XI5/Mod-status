name: Mod status

on:
  schedule:
    - cron: "0 */3 * * *"  # every 3 hours
  workflow_dispatch:
    inputs:
      mod:
        description: "Which mod"
        type: choice
        default: internal-graphics
        options:
          - internal-graphics
          - lod-fix
      mode:
        description: "New status"
        type: choice
        default: working
        options:
          - working
          - broken
          - wip
          - check

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Update badges
        run: |
          if [ "${{ github.event_name }}" = "schedule" ] || [ "${{ inputs.mode }}" = "check" ]; then
            python scripts/update.py check
          else
            python scripts/update.py "${{ inputs.mod }}" "${{ inputs.mode }}"
          fi
      - name: Commit if changed
        run: |
          git config user.name "status-bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add state.json *.json
          git diff --cached --quiet || (git commit -m "Update mod status" && git push)
